<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Exam</title>
</head>
<body>
    <h1>Forming the Regisration of a Form: </h1>
    <form id="registration">
        <!-- full name -->
        <p>
            <label for="fullName" >Full Name</label> <br> 
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name ...">
        </p>

        <!-- date of birth -->
        <p>
            <label for="birthday">Date of Birth</label> <br>
            <input type="date" id="birthday" name="birthday">
        </p>

        <!-- gender -->
        <p>
            <label for="gender">Gender</label> <br>
            <input type="radio" name="gender" value="Male"> Male <br>
            <input type="radio" name="gender" value="Female"> Female <br>
        </p>

        <!-- religion -->
        <p>
            <label for="religion">Religion</label>
            <select id="religion" name="religion">
                <option value="" selected hidden>...</option>
                <option value="Islam">Islam</option>
                <option value="Protestantism">Protestantism</option>
                <option value="Catholicism">Catholicism</option>
                <option value="Hinduism">Hinduism</option>                
                <option value="Buddhism">Buddhism</option>                
                <option value="Confucianism">Confucianism</option>
            </select>
        </p>

        <!-- how they got information about Telkom -->
        <p>
            <label for="info">How did you get info about SMK Telkom Malang?</label> <br>
            <input type="checkbox" class="info" value="Brochure"> Brochure <br>
            <input type="checkbox" class="info" value="Newspaper"> Newspaper <br>
            <input type="checkbox" class="info" value="Banner"> Banner <br>
            <input type="checkbox" class="info" value="Website"> Website <br>
            <input type="checkbox" class="info" value="Friend"> Friend <br>
        </p>

        <p>
            <button type="submit">Submit!</button>
            <button type="reset">Nevermind .. </button>
        </p>

    </form>
    
    <p id="feedback"></p>
    <div class="summary" style="background: #0c630438">
        <p id="summary"></p>
    </div>
    <script src="Exam.js"></script>
</body>
</html>
